[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so_clustering"
version = "0.1.0"
description = "Shape-oriented clustering of distributions using the Wasserstein distance"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zhijun Liu" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/anALPAKKA/so_clustering"

[tool.setuptools]
packages = ["so_clustering"]
